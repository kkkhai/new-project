name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Verify every level is solvable (replays stored solutions)
        run: npm run verify-levels
      - name: Build web version
        run: npm run build
      - name: Browser smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
